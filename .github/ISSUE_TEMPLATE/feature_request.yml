name: 기능 제안
description: 새로운 기능 또는 개선 아이디어를 제안합니다.
title: "[feature] "
labels:
  - feature
body:
  - type: markdown
    attributes:
      value: |
        기능 제안은 문제 중심으로 작성해 주시면 우선순위 판단에 큰 도움이 됩니다.

  - type: textarea
    id: problem
    attributes:
      label: 해결하려는 문제
      description: 현재 어떤 점이 불편하거나 부족한가요?
      placeholder: 예) membrane 계약 위반 원인을 Viewer에서 바로 확인하기 어렵습니다.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 제안 내용
      description: 어떤 방식으로 해결하면 좋을지 구체적으로 작성해 주세요.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 대안 비교
      description: 고려한 다른 방법이 있다면 함께 작성해 주세요.
    validations:
      required: false

  - type: textarea
    id: scope
    attributes:
      label: 영향 범위
      description: Runtime / Bridge / Viewer / DSL / Docs 중 영향 범위를 알려주세요.
      placeholder: 예) Runtime + Viewer
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: 완료 기준(Definition of Done)
      description: 이 기능이 완료되었다고 판단할 수 있는 기준을 작성해 주세요.
      placeholder: 예) signal trace에서 계약 위반 지점을 클릭하면 원인 코드와 타입 정보가 표시된다.
    validations:
      required: true

