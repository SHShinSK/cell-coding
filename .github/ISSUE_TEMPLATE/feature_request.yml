name: Feature request · 기능 제안
description: Propose a new feature or improvement. 새로운 기능 또는 개선 아이디어를 제안합니다.
title: "[feature] "
labels:
  - feature
body:
  - type: markdown
    attributes:
      value: |
        English first · Korean parallel. Problem-focused proposals help us prioritize.
        영어 우선 · 한국어 병렬. 문제 중심 제안은 우선순위 판단에 큰 도움이 됩니다.

  - type: textarea
    id: problem
    attributes:
      label: Problem to solve · 해결하려는 문제
      description: What is inconvenient or missing today? 현재 어떤 점이 불편하거나 부족한가요?
      placeholder: e.g.) Hard to see membrane contract violations in the viewer · Viewer에서 membrane 계약 위반을 바로 확인하기 어렵습니다.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal · 제안 내용
      description: How should we solve it? 어떤 방식으로 해결하면 좋을지 구체적으로 작성해 주세요.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives · 대안 비교
      description: Other approaches you considered. 고려한 다른 방법이 있다면 함께 작성해 주세요.
    validations:
      required: false

  - type: textarea
    id: scope
    attributes:
      label: Impact scope · 영향 범위
      description: Runtime / Bridge / Viewer / DSL / Docs. 영향 받는 영역을 알려주세요.
      placeholder: e.g.) Runtime + Viewer
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: Definition of done · 완료 기준
      description: How reviewers will know it is done. 완료 판단 기준을 작성해 주세요.
      placeholder: e.g.) Signal trace shows contract violation with source line and type · signal trace에서 계약 위반 지점과 타입 정보가 표시된다.
    validations:
      required: true
