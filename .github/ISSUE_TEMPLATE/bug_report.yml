name: 버그 리포트
description: 재현 가능한 결함을 제보합니다.
title: "[bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        감사합니다. 재현 가능한 버그 리포트는 문제 해결 속도를 크게 높입니다.

  - type: textarea
    id: summary
    attributes:
      label: 요약
      description: 어떤 문제가 발생했는지 한두 문장으로 설명해 주세요.
      placeholder: 예) MotionDetected 신호를 emit해도 AlarmActuator가 반응하지 않습니다.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 기대 동작
      description: 원래 어떻게 동작해야 하는지 작성해 주세요.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 실제 동작
      description: 실제로 어떤 동작이 발생했는지 작성해 주세요.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 재현 절차
      description: 최소 재현 절차를 단계별로 작성해 주세요.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 로그 / 스크린샷 / 추가 정보
      description: 에러 로그, 스택 트레이스, 화면 캡처 등을 첨부해 주세요.
      render: shell
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: 사용 버전
      description: 앱/패키지 버전을 작성해 주세요.
      placeholder: 예) v0.1.2
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: 실행 환경
      description: OS, 런타임(Node/Python), 브라우저 등
      placeholder: 예) Windows 11, Node 20.15, Python 3.11
    validations:
      required: true

