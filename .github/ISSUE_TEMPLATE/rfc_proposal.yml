name: RFC proposal · RFC 제안
description: Propose a design or policy change. 중요한 설계/정책 변경을 제안합니다.
title: "[rfc] "
labels:
  - rfc
body:
  - type: markdown
    attributes:
      value: |
        English first · Korean parallel. DSL grammar, runtime semantics, and public API changes follow the RFC process.
        영어 우선 · 한국어 병렬. DSL 문법, Runtime 의미론, 공용 API 변경은 RFC 프로세스를 따라 주세요.

  - type: input
    id: rfc_title
    attributes:
      label: RFC title · RFC 제목
      placeholder: e.g.) Unify membrane query semantics · membrane query 의미론 통일 제안
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem definition · 문제 정의
      description: Limits or conflicts in the current design. 현재 설계의 한계나 충돌.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal summary · 제안 요약
      description: Core proposal in 5–10 lines. 핵심 제안을 5~10줄 내로 요약.
    validations:
      required: true

  - type: textarea
    id: compatibility
    attributes:
      label: Backward compatibility · 하위 호환성 영향
      description: Breaking changes and migration path. 브레이킹 변경 여부와 마이그레이션 방법.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and trade-offs · 대안 및 트레이드오프
      description: Why this proposal wins over alternatives. 대안 대비 장점.
    validations:
      required: true

  - type: textarea
    id: rollout
    attributes:
      label: Rollout plan · 도입 계획
      description: Phased rollout, flags, rollback. 단계적 적용/실험 플래그/롤백 계획.
    validations:
      required: true
