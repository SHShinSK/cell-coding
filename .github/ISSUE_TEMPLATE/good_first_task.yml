name: Good first task · 첫 기여 작업
description: Small task for new contributors. 신규 기여자가 빠르게 시작할 수 있는 작업.
title: "[good-first-issue] "
labels:
  - good first issue
  - help wanted
body:
  - type: markdown
    attributes:
      value: |
        English first · Korean parallel. Aim for 1–3 hours of work.
        영어 우선 · 한국어 병렬. 첫 기여 작업은 1~3시간 내 완료 가능한 범위를 권장합니다.

  - type: input
    id: objective
    attributes:
      label: Objective · 작업 목표
      description: One-sentence goal. 한 문장으로 작업 목표를 작성해 주세요.
      placeholder: e.g.) Update quick-start commands in README · README의 빠른 시작 명령을 최신 구조로 갱신
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context · 배경
      description: Why is this needed? 왜 필요한 작업인지 설명해 주세요.
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: Tasks · 세부 작업
      description: Checklist format. 체크리스트 형태로 작성해 주세요.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: References · 참고 파일/링크
      description: Paths newcomers can open immediately. 초보 기여자가 바로 접근할 수 있는 경로.
      placeholder: e.g.) README.md, ROADMAP.md
    validations:
      required: false

  - type: textarea
    id: done
    attributes:
      label: Definition of done · 완료 기준
      description: Concrete review criteria. 리뷰어가 확인할 기준을 구체적으로 작성해 주세요.
    validations:
      required: true
