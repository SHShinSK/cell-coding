# TypeScript compiler · integration & observability E2E
name: CI

on:
  push:
    branches: [main]
    paths:
      - "typescript/**"
      - "runtime-docker/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "typescript/**"
      - "runtime-docker/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: typescript/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: npm pack smoke
        run: npm run pack:smoke

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: typescript
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: typescript/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Redis Streams testcontainers
        env:
          CELL_INTEGRATION: "1"
        run: npm run test:integration

  observability-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Start observability stack
        working-directory: runtime-docker
        run: |
          docker compose --profile observability up -d --build \
            redis worker-organ prometheus otel-collector jaeger
          sleep 20

      - name: Verify Prometheus scrape
        env:
          VERIFY_TIMEOUT_MS: "120000"
        run: node runtime-docker/verify-prometheus.mjs

      - name: Verify OTel Collector → Jaeger
        env:
          VERIFY_TIMEOUT_MS: "120000"
        run: node runtime-docker/verify-otel.mjs

      - name: Tear down stack
        if: always()
        working-directory: runtime-docker
        run: docker compose --profile observability down -v --remove-orphans
