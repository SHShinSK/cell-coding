# GitHub Release + npm / PyPI / VS Code Marketplace publish
# 태그 v* push 또는 workflow_dispatch → 검증 후 배포
#
# Required secrets · 필수 시크릿:
#   NPM_TOKEN   — npmjs.com Automation token (@cell-coding scope)
#   PYPI_TOKEN  — PyPI API token (cell-coding-bridge)
#   VSCE_PAT    — VS Code Marketplace Personal Access Token

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate · 검증
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            typescript/package-lock.json
            extensions/cell-viewer/package-lock.json
            viewer-react/package-lock.json

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            VER="0.1.0"
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Release version · 릴리즈 버전: $VER"

      - name: Sync @cell-coding/cli version
        working-directory: typescript
        run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Install & test CLI
        working-directory: typescript
        run: |
          npm ci
          npm test
          npm run pack:smoke

      - name: Build VS Code extension bundle
        run: |
          cd viewer-react && npm ci && npm run build
          cd ../extensions/cell-viewer && npm ci && npm run build:viewer && npm run compile

      - name: Python sdist check
        working-directory: bridge-python
        run: |
          python -m pip install --upgrade pip build
          python -m pip install -e .
          python -c "from cell_bridge import run_cell_file, simulate_motion; print('bridge ok')"

  github-release:
    name: GitHub Release · 릴리즈 노트
    needs: validate
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

  publish-npm:
    name: npm @cell-coding/cli
    needs: validate
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Sync version
        run: npm version "${{ needs.validate.outputs.version }}" --no-git-tag-version --allow-same-version

      - run: npm ci
      - run: npm test

      - name: Publish
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-pypi:
    name: PyPI cell-coding-bridge
    needs: validate
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    defaults:
      run:
        working-directory: bridge-python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Sync version in pyproject.toml
        shell: bash
        run: |
          VER="${{ needs.validate.outputs.version }}"
          sed -i "s/^version = \".*\"/version = \"$VER\"/" pyproject.toml

      - run: python -m pip install --upgrade pip build twine

      - name: Build & publish
        run: |
          python -m build
          python -m twine upload dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}

  publish-vscode:
    name: VS Code Marketplace
    needs: validate
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    defaults:
      run:
        working-directory: extensions/cell-viewer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync extension version
        shell: bash
        run: |
          VER="${{ needs.validate.outputs.version }}"
          node -e "
            const fs=require('fs');
            const p='package.json';
            const j=JSON.parse(fs.readFileSync(p,'utf8'));
            j.version=process.env.VER;
            fs.writeFileSync(p, JSON.stringify(j,null,2)+'\n');
          "
        env:
          VER: ${{ needs.validate.outputs.version }}

      - run: npm ci
      - run: |
          cd ../../viewer-react && npm ci && npm run build
          npm run vscode:prepublish

      - name: Publish to Open VSX / Marketplace
        run: npx @vscode/vsce publish --skip-duplicate
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
