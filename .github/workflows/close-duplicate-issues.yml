# Close duplicate starter issues #2–#19 (keep canonical #20–#28)
# Run: Actions → Close duplicate starter issues → Run workflow

name: Close duplicate starter issues

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/close-duplicate-issues.yml

permissions:
  issues: write
  contents: read

jobs:
  close-duplicates:
    runs-on: ubuntu-latest
    steps:
      - name: Close issues #2–#19 via REST API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          close_issue() {
            local num=$1
            local canon=$2
            local state
            state=$(curl -sS -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/issues/${num}" \
              | jq -r '.state // "missing"')
            if [ "$state" != "open" ]; then
              echo "Skip #${num} (state=${state})"
              return 0
            fi
            curl -sS -X PATCH \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/issues/${num}" \
              -d '{"state":"closed","state_reason":"not_planned"}' > /dev/null
            curl -sS -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/issues/${num}/comments" \
              -d "$(jq -nc --arg b "Duplicate starter issue — superseded by canonical **#${canon}** (EN/KR bilingual draft). 중복 스타터 이슈 — 정본 **#${canon}** 으로 대체됨." '{body:$b}')" > /dev/null
            echo "Closed #${num} → canonical #${canon}"
            sleep 1
          }
          for offset in 0 1 2 3 4 5 6 7 8; do
            canon=$((20 + offset))
            close_issue $((2 + offset)) "$canon"
            close_issue $((11 + offset)) "$canon"
          done

      - name: Ensure #22 has bug label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          has_bug=$(curl -sS -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/issues/22" \
            | jq '[.labels[].name] | index("bug") != null')
          if [ "$has_bug" = "true" ]; then
            echo "Issue #22 already has bug label"
          else
            curl -sS -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/issues/22/labels" \
              -d '["bug"]' > /dev/null
            echo "Added bug label to #22"
          fi

      - name: Summary
        run: |
          echo "Expected open starter issues: #20–#28 (9 items)"
          echo "https://github.com/${{ github.repository }}/issues?q=is%3Aissue+is%3Aopen"
