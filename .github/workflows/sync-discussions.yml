# Welcome #1 본문 동기화·고정, Q&A 시드 스레드 생성
name: Sync community discussions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/discussions/**
      - .github/workflows/sync-discussions.yml
      - .github/scripts/extract-discussion-body.py

permissions:
  discussions: write
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Sync welcome discussion #1 and seed Q&A"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail

          gql() {
            gh api graphql "$@" 2>&1 | tee /tmp/gql-out.json
            if jq -e '.errors' /tmp/gql-out.json > /dev/null 2>&1; then
              echo "GraphQL error:" >&2
              jq '.errors' /tmp/gql-out.json >&2
              return 1
            fi
            cat /tmp/gql-out.json
          }

          DISC_ID=$(gql -f query='query($o:String!,$n:String!){repository(owner:$o,name:$n){discussion(number:1){id}}}' \
            -f o="$REPO_OWNER" -f n="$REPO_NAME" | jq -r '.data.repository.discussion.id')

          if [ "$DISC_ID" = "null" ] || [ -z "$DISC_ID" ]; then
            echo "Discussion #1 not found — skip update"
          else
            python3 .github/scripts/extract-discussion-body.py .github/discussions/001-welcome-announcement.md > /tmp/welcome-body.md
            WELCOME_BODY=$(cat /tmp/welcome-body.md)
            gql -f query='mutation($id:ID!,$body:String!){updateDiscussion(input:{discussionId:$id,body:$body}){discussion{url}}}' \
              -f id="$DISC_ID" -f body="$WELCOME_BODY" | jq -r '.data.updateDiscussion.discussion.url'
            echo "Updated discussion #1 body"

            gql -f query='mutation($id:ID!){pinDiscussion(input:{discussionId:$id}){clientMutationId}}' \
              -f id="$DISC_ID" | jq -r '.data.pinDiscussion.clientMutationId' > /dev/null
            echo "Pinned discussion #1"
          fi

          META=$(gql -f query='query($o:String!,$n:String!){repository(owner:$o,name:$n){id discussionCategories(first:20){nodes{id slug}}}}' \
            -f o="$REPO_OWNER" -f n="$REPO_NAME")

          REPO_NODE=$(echo "$META" | jq -r '.data.repository.id')
          QA_CAT=$(echo "$META" | jq -r '.data.repository.discussionCategories.nodes[] | select(.slug=="q-a") | .id')

          if [ -z "$QA_CAT" ] || [ "$QA_CAT" = "null" ]; then
            echo "Q&A category not found — skip seed"
            exit 0
          fi

          QA_TITLE="New here? Ask anything about Cell Coding · 처음이신가요? 세포코딩 질문을 남겨 주세요"
          EXISTING=$(gql -f query='query($o:String!,$n:String!,$cat:ID!){repository(owner:$o,name:$n){discussions(first:30,categoryId:$cat){nodes{title}}}}' \
            -f o="$REPO_OWNER" -f n="$REPO_NAME" -f cat="$QA_CAT")

          if echo "$EXISTING" | jq -e --arg t "$QA_TITLE" '.data.repository.discussions.nodes[] | select(.title==$t)' > /dev/null; then
            echo "Q&A seed thread already exists"
            exit 0
          fi

          python3 .github/scripts/extract-discussion-body.py .github/discussions/002-qa-welcome.md > /tmp/qa-body.md
          QA_BODY=$(cat /tmp/qa-body.md)
          gql -f query='mutation($repo:ID!,$cat:ID!,$title:String!,$body:String!){createDiscussion(input:{repositoryId:$repo,categoryId:$cat,title:$title,body:$body}){discussion{url number}}}' \
            -f repo="$REPO_NODE" -f cat="$QA_CAT" -f title="$QA_TITLE" -f body="$QA_BODY" \
            | jq -r '.data.createDiscussion.discussion | "Created Q&A #\(.number): \(.url)"'
