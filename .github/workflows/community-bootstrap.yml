# Community bootstrap — starter issues (+ optional About via PAT)
#
# Run: Actions → Community bootstrap → Run workflow
#
# About/Topics cannot be set with GITHUB_TOKEN alone.
#   → Set manually in repo About (see reminder job below)
#   → Or add REPO_ADMIN_TOKEN (PAT, repo scope) secret for API update

name: Community bootstrap

on:
  workflow_dispatch:
    inputs:
      create_issues:
        description: "Create starter issues (9 items, #1 excluded)"
        type: boolean
        default: true
      update_about:
        description: "About reminder (+ PAT update if REPO_ADMIN_TOKEN secret exists)"
        type: boolean
        default: true

jobs:
  about-reminder:
    if: inputs.update_about
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: About / Topics — manual values · 수동 설정 값
        run: |
          echo "::notice title=About (수동)::저장소 About 톱니 → Edit"
          echo "Description: Physical AI를 위한 이벤트 기반 세포코딩 | Event-driven biological programming for Physical AI"
          echo "Website: https://shshinsk.github.io/cell-coding/"
          echo "Topics: physical-ai, event-driven-architecture, typescript, python, open-source, dsl, robotics"
          echo "Guide: .github/DISCUSSIONS_SETUP.md"

      - name: Update About via PAT (optional)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "REPO_ADMIN_TOKEN secret not set — skip API update (use About UI manually)."
            exit 0
          fi
          gh api --method PATCH "repos/${{ github.repository }}" \
            -f description='Physical AI를 위한 이벤트 기반 세포코딩 | Event-driven biological programming for Physical AI' \
            -f homepage='https://shshinsk.github.io/cell-coding/'
          gh api --method PUT "repos/${{ github.repository }}/topics" \
            -H "Accept: application/vnd.github+json" \
            -f 'names[]=physical-ai' \
            -f 'names[]=event-driven-architecture' \
            -f 'names[]=typescript' \
            -f 'names[]=python' \
            -f 'names[]=open-source' \
            -f 'names[]=dsl' \
            -f 'names[]=robotics'
          echo "About/Topics updated via REPO_ADMIN_TOKEN."

  bootstrap-issues:
    if: inputs.create_issues
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure labels exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          labels=(
            "good first issue:FBCA04:Good for newcomers"
            "help wanted:008672:Extra attention needed"
            "bug:d73a4a:Something isn't working"
            "feature:a2eeef:New feature or request"
            "docs:0075ca:Documentation"
            "rfc:d876e3:Design / policy proposal"
            "question:d876e3:Further information is requested"
            "area:runtime:5319e7:Runtime core"
            "area:dsl-compiler:5319e7:DSL compiler"
            "area:docs:0075ca:Documentation"
            "area:bridge-python:5319e7:Python bridge"
            "area:viewer:5319e7:Cell viewer"
            "area:devops:5319e7:DevOps and CI"
            "priority:critical:b60205:Critical priority"
            "priority:low:c5def5:Low priority"
            "priority:medium:fbca04:Medium priority"
            "priority:high:d93f0b:High priority"
            "status:needs-triage:ededed:Needs triage"
            "status:needs-repro:d876e3:Needs reproduction"
            "status:blocked:d73a4a:Blocked"
            "status:in-progress:fbca04:In progress"
            "status:needs-review:0e8a16:Needs review"
          )
          for entry in "${labels[@]}"; do
            desc="${entry##*:}"
            tmp="${entry%:*}"
            color="${tmp##*:}"
            name="${tmp%:*}"
            gh label create "$name" --color "$color" --description "$desc" --force 2>/dev/null || true
          done

      - name: Create starter issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          created=0
          for file in .github/issue-drafts/[0-9][0-9]-*.md; do
            base=$(basename "$file")
            if [ "$base" = "01-readme-badges.md" ]; then
              echo "Skip (already implemented): $base"
              continue
            fi
            title=$(head -n1 "$file" | sed 's/^#[[:space:]]*//')
            existing=$(gh issue list --repo "${{ github.repository }}" --search "in:title \"$title\"" --state open --json number --jq 'length')
            if [ "$existing" != "0" ]; then
              echo "Skip (exists): $title"
              continue
            fi
            label_args=()
            labels_line=$(grep -m1 '^\*\*Labels:\*\*' "$file" || true)
            if [ -n "$labels_line" ]; then
              while IFS= read -r label; do
                [ -n "$label" ] && label_args+=(--label "$label")
              done < <(echo "$labels_line" | grep -o '`[^`]*`' | tr -d '`')
            fi
            if [ ${#label_args[@]} -eq 0 ]; then
              label_args=(--label "good first issue" --label "help wanted")
            fi
            echo "Create: $title (${#label_args[@]} label args)"
            gh issue create \
              --repo "${{ github.repository }}" \
              --title "$title" \
              --body-file "$file" \
              "${label_args[@]}"
            created=$((created + 1))
            sleep 2
          done
          echo "Created $created new issue(s)."

      - name: Summary
        run: |
          echo "Issues: https://github.com/${{ github.repository }}/issues"
          echo "Labels: https://github.com/${{ github.repository }}/labels"
